<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StrideLink Walkthrough — size preview</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0908;min-height:100vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
       gap:56px;font-family:'Outfit',system-ui,sans-serif;color:#857c6e;padding:28px}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .lab{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .lab b{color:#dd9a52}
  .note{max-width:70mm;text-align:center;font-size:10px;line-height:1.55;color:#5b554c}

  /* ── full-size (fills the height, like the web view) ── */
  .big{height:86vh;aspect-ratio:9/16;border-radius:14px;overflow:hidden;
       box-shadow:0 30px 80px -22px rgba(0,0,0,.75);border:1px solid rgba(216,201,176,.1)}
  .big iframe{width:100%;height:100%;border:0;display:block}

  /* ── iPhone 13 Pro at (approx) physical size, via CSS mm ──
     6.1" display, 2532x1170 @460ppi -> screen active area ~64.6 x 139.8 mm (19.5:9).
     A full-width 9:16 reel occupies 64.6 x 114.8 mm, centered with black bars. ── */
  .phone{position:relative;background:#0b0b0d;border:2.4mm solid #17171a;border-radius:12mm;
         box-shadow:0 30px 80px -20px rgba(0,0,0,.85), inset 0 0 0 .4mm #2a2a2e}
  .screen{width:64.6mm;height:139.8mm;border-radius:9mm;overflow:hidden;background:#000;
          display:flex;align-items:center;justify-content:center;position:relative}
  .screen iframe{width:64.6mm;height:114.8mm;border:0;display:block}      /* the 9:16 reel, centered */
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:22mm;height:4.2mm;
         background:#0b0b0d;border-radius:0 0 3mm 3mm;z-index:5}
  /* side buttons for realism */
  .phone::before{content:"";position:absolute;left:-3.2mm;top:30mm;width:1mm;height:22mm;background:#17171a;border-radius:2mm}
  .phone::after{content:"";position:absolute;right:-3.2mm;top:26mm;width:1mm;height:14mm;background:#17171a;border-radius:2mm}
</style>
</head>
<body>
  <div class="col">
    <div class="lab">Full size (web)</div>
    <div class="big"><iframe src="stridequick-walkthrough.html" scrolling="no" loading="eager"></iframe></div>
  </div>

  <div class="col">
    <div class="lab"><b>iPhone 13 Pro</b> · actual size</div>
    <div class="phone"><div class="screen"><div class="notch"></div>
      <iframe src="stridequick-walkthrough.html" scrolling="no" loading="eager"></iframe>
    </div></div>
    <div class="note">Approx physical size (CSS mm). If it reads larger or smaller than a real phone, your
      monitor's PPI / OS scaling differs from the 96dpi CSS reference — tell me your monitor and I'll pin exact px.</div>
  </div>
</body>
</html>
