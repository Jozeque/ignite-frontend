<!doctype html><html><head><meta charset="utf-8"><title>series plate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap');
  html,body{margin:0;background:#0a0908;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Outfit}
  #c{height:97vh;aspect-ratio:9/16}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Static background plate for the StrideQuick series composite.
// Footage (macros + StrideLink) is overlaid by ffmpeg at MAC / SL placements below.
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const VW=1080,VH=1920;
const COP='#c6712b',INK='#f2ede4',INK3='#a99f8d';
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const ablImg=new Image();let ablOK=false;const ablBg=document.createElement('canvas');ablBg.width=VW;ablBg.height=VH;
ablImg.onload=()=>{const g=ablBg.getContext('2d'),ar=ablImg.width/ablImg.height,vr=VW/VH;let dw,dh;if(ar>vr){dh=VH;dw=VH*ar;}else{dw=VW;dh=VW/ar;}g.fillStyle='#e7e3da';g.fillRect(0,0,VW,VH);g.filter='blur(14px)';g.drawImage(ablImg,(VW-dw)/2,(VH-dh)/2,dw,dh);g.filter='none';ablOK=true;draw();};ablImg.src='ableton-light.png';
// placements — MUST match the ffmpeg overlay x/y
const MAC={x:42,y:422,w:996,h:466};    // macros bezel slot — scaled ~2.69x to match the previous reel's macro KNOB size (wider bezel for the 7-column rack)
const SLD={x:74,y:1102,w:933,h:396};    // StrideLink FOOTAGE placement (live mouse/features) — same 933x396 output as every reel so the hero device is identical
function draw(){
  if(ablOK)ctx.drawImage(ablBg,0,0,VW,VH);else{ctx.fillStyle='#e7e3da';ctx.fillRect(0,0,VW,VH);}
  ctx.save();ctx.globalAlpha=.10;ctx.fillStyle=COP;ctx.fillRect(0,0,VW,VH);ctx.restore();
  const tS=ctx.createLinearGradient(0,0,0,360);tS.addColorStop(0,'rgba(15,14,11,.94)');tS.addColorStop(1,'rgba(15,14,11,0)');ctx.fillStyle=tS;ctx.fillRect(0,0,VW,360);
  const bS=ctx.createLinearGradient(0,1440,0,VH);bS.addColorStop(0,'rgba(15,14,11,0)');bS.addColorStop(.375,'rgba(15,14,11,.86)');bS.addColorStop(1,'rgba(15,14,11,.97)');ctx.fillStyle=bS;ctx.fillRect(0,1440,VW,VH-1440);
  // rack = framed bezel (footage inset inside it)
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=46;ctx.shadowOffsetY=20;ctx.fillStyle='#14120e';rr(MAC.x,MAC.y,MAC.w,MAC.h,24);ctx.fill();ctx.restore();
  // StrideLink = bare clean device with a soft matte contact shadow (no bezel), exactly like the walkthrough
  ctx.save();ctx.fillStyle='rgba(0,0,0,.5)';ctx.filter='blur(26px)';rr(SLD.x+22,SLD.y+SLD.h-18,SLD.w-44,56,30);ctx.fill();ctx.restore();
  // wordmark
  ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.fillStyle=INK;ctx.font='900 30px Outfit';ctx.fillText('STRIDE',70,148);ctx.fillStyle=COP;ctx.font='800 17px Outfit';ctx.fillText('Link',196,148);
  // caption (device name + one line)
  ctx.textAlign='center';ctx.fillStyle=COP;ctx.font='900 48px Outfit';ctx.fillText('METALLIC IMPACTS',540,1680);ctx.textAlign='left';
}
window.__seek=function(){draw();};
</script></body></html>
