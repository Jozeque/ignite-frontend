<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride · Inject — Reel (9:16)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#070708;overflow:hidden}
  body{font-family:'Outfit',system-ui,sans-serif;display:grid;place-items:center}
  #wrap{position:relative;height:100vh;width:auto;aspect-ratio:9/16;max-width:100vw;margin:auto}
  @supports not (aspect-ratio:1){ #wrap{width:56.25vh;height:100vh} }
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .3s}
  #wrap:hover #hud{opacity:1}
  #hud button{font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#dcdce0;background:rgba(18,18,22,.82);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(8px)}
  #hud button:hover{border-color:rgba(221,154,82,.6);color:#dd9a52}
  #hud .t{font-size:10px;font-weight:600;color:#6b6b72;min-width:40px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas>
  <div id="hud"><button id="pp">Pause</button><span class="t" id="tt">0.0s</span><button id="rs">Restart</button></div>
</div>
<script>
const cv=document.getElementById('c'), ctxMain=cv.getContext('2d');
const oc=document.createElement('canvas'), octx=oc.getContext('2d');
let ctx=octx, W=0,H=0,DPR=1,Sv=1; const VW=1080, VH=1920;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;Sv=W/VW;cv.width=oc.width=Math.round(W*DPR);cv.height=oc.height=Math.round(H*DPR);}
new ResizeObserver(resize).observe(cv);resize();
const logo=new Image();let logoOK=false;logo.onload=()=>{logoOK=true;};logo.src='stride-logo.png';
// real Ableton UI as a blurred backdrop
const abl=new Image();let ablOK=false;const ablBg=document.createElement('canvas');
function buildAblBg(){ablBg.width=1080;ablBg.height=1920;const g=ablBg.getContext('2d');g.fillStyle='#0c0c0e';g.fillRect(0,0,1080,1920);
  const iw=abl.naturalWidth,ih=abl.naturalHeight,sc=Math.max(1080/iw,1920/ih),dw=iw*sc,dh=ih*sc;   // cover the whole frame
  g.filter='blur(5px)';g.drawImage(abl,(1080-dw)/2,(1920-dh)/2,dw,dh);g.filter='none';}
abl.onload=()=>{buildAblBg();ablOK=true;};abl.src='ableton-ui.png';

// ── palette ───────────────────────────────────────────────────────────
const BG0='#0a0a0c', INK='#edeef0', SUB='#8a8a92';
const COP='#c6712b', AMB='#dd9a52', TEAL='#2f748e', GRN='#5b7b55', RED='#a34e52', VIO='#6f6494';
const LANES=[
  {c:COP,name:'CUTOFF',seed:0.13},{c:AMB,name:'DRIVE',seed:0.61},{c:TEAL,name:'MORPH',seed:0.34},
  {c:GRN,name:'PITCH',seed:0.78},{c:RED,name:'DELAY',seed:0.47},{c:VIO,name:'BITCRUSH',seed:0.92},
];
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
const E={io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,
  expoIn:t=>t<=0?0:Math.pow(2,9*t-9),back:t=>{const c=1.9,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);},smooth:t=>t*t*(3-2*t)};

// ── patterns ──────────────────────────────────────────────────────────
function hash(i,s){let h=Math.sin((i+1)*43758.5453+s*91.7);return h-Math.floor(h);}
function patSH(seed,x){const steps=8;const i=Math.floor(clamp(x,0,0.999)*steps);return clamp(0.12+0.76*hash(i,seed),0,1);}
function patChaos(seed,x){return clamp(0.5+0.27*Math.sin(x*17+seed*9)+0.18*Math.sin(x*43+seed*3)+0.13*Math.sin(x*88-seed*5)+0.09*Math.sin(x*150+seed*2),0,1);}
function patFn(p){return p==='sh'?patSH:patChaos;}
// REFLECTOR = lanes mirror each other. Each pair: even lane = source, odd lane = its vertical mirror (1-src).
function reflectSource(x,pair){return clamp(0.5+0.30*Math.sin(x*6.283+pair*1.3)+0.16*Math.sin(x*12.5+pair*2.1)+0.08*Math.sin(x*20+pair),0,1);}
// ── REAL generators ported from canvas.js — the lanes now show the app's exact output ──
const BEATS=8;
const clamp01=v=>v<0?0:v>1?1:v;
const _trueRandom=Math.random;
function _seededRng(seed){let a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function withSeed(seed,fn){Math.random=_seededRng(seed);try{return fn();}finally{Math.random=_trueRandom;}}
function injectShape(pts,shape,cB,chunk){
  const addPt=(t,v)=>pts.push({time:Math.round(t*10000)/10000,value:clamp01(v),curve:0});
  if(shape==='dotted_ramp'){let pk=0.4+Math.random()*0.6;addPt(cB,0);addPt(cB+chunk*0.75,pk);addPt(cB+chunk*0.75+0.01,0);addPt(cB+chunk,0);}
  else if(shape==='mid_value_hold'){let mv=0.15+Math.random()*0.35,pk=0.7+Math.random()*0.3;addPt(cB,0);addPt(cB+0.01,pk);addPt(cB+chunk*0.25,pk);addPt(cB+chunk*0.25+0.01,mv);addPt(cB+chunk*0.75,mv);addPt(cB+chunk*0.75+0.01,pk);addPt(cB+chunk-0.01,pk);addPt(cB+chunk,0);}
  else if(shape==='offgrid_saw'){let pk=0.5+Math.random()*0.5,og=[0.216,0.414,0.618,0.88][Math.floor(Math.random()*4)];addPt(cB,0);addPt(cB+0.01,pk);addPt(cB+chunk*og,0);addPt(cB+chunk,0);}
  else if(shape==='hard_chop'){let sub=chunk/4;for(let i=0;i<4;i++){let val=Math.random()>0.5?(Math.random()>0.5?1:0.3+Math.random()*0.5):0;if(val>0){let t=cB+i*sub;addPt(t,0);addPt(t+0.01,val);addPt(t+sub*0.85,0);}}addPt(cB+chunk,0);}
  else if(shape==='exponential_build'){addPt(cB,0);addPt(cB+chunk*0.5,0.2);addPt(cB+chunk*0.8,0.5);addPt(cB+chunk-0.01,1);addPt(cB+chunk,0);}
  else if(shape==='hyper_stutter'){let ss=Math.random()>0.5?0.125:0.0625,steps=Math.floor(chunk/ss);for(let i=0;i<steps;i++){if(i%2===0){let t=cB+i*ss;addPt(t,0);addPt(t+0.001,0.6+Math.random()*0.4);addPt(t+ss*0.9,0);}}addPt(cB+chunk,0);}
  else if(shape==='rhythmic_gate_build'){let step=[0.125,0.25,0.5][Math.floor(Math.random()*3)],steps=Math.floor(chunk/step),sv=0.7+Math.random()*0.3,ev=Math.random()*0.3,up=Math.random()>0.5;for(let i=0;i<steps;i++){let t=cB+i*step,pr=i/Math.max(1,steps-1),cp=up?ev+(sv-ev)*pr:sv+(ev-sv)*pr;addPt(t,0);addPt(t+0.001,cp);addPt(t+step*0.85,0);}addPt(cB+chunk,0);}
  else if(shape==='syncopated_drops'){let step=0.25,steps=Math.floor(chunk/step);for(let i=0;i<steps;i++){if(Math.random()>0.3){let t=cB+i*step,pk=0.3+Math.random()*0.7;addPt(t,0);addPt(t+0.001,pk);addPt(t+step*0.8,pk*0.8);addPt(t+step*0.81,0);}}addPt(cB+chunk,0);}
}
const NEURO_POOL=['dotted_ramp','mid_value_hold','offgrid_saw','hard_chop','exponential_build','hyper_stutter','rhythmic_gate_build','syncopated_drops'];
function genNeuro(sB,eB){const pts=[];let cB=sB;while(cB<eB-0.001){let chunk=[0.5,1,1.5,2,4][Math.floor(Math.random()*5)];if(cB+chunk>eB)chunk=eB-cB;injectShape(pts,NEURO_POOL[Math.floor(Math.random()*NEURO_POOL.length)],cB,chunk);cB=Math.round((cB+chunk)*10000)/10000;}return pts;}
function genChaos(sB,eB){const dur=eB-sB,numLayers=2+Math.floor(Math.random()*3),waves=[];for(let i=0;i<numLayers;i++)waves.push({freq:0.3+Math.random()*2.2,amp:0.15+Math.random()*0.35,phase:Math.random()*Math.PI*2,useCos:Math.random()>0.5});const noiseAmt=0.1+Math.random()*0.25,spikeProb=0.08+Math.random()*0.15,raw=[];for(let b=0;b<=dur;b+=0.25){let v=0.5;for(const w of waves)v+=(w.useCos?Math.cos(b*w.freq+w.phase):Math.sin(b*w.freq+w.phase))*w.amp;if(Math.random()<spikeProb)v=Math.random();else v+=(Math.random()*2-1)*noiseAmt;raw.push({time:sB+b,value:v});}const rMin=Math.min.apply(null,raw.map(p=>p.value)),rMax=Math.max.apply(null,raw.map(p=>p.value)),rRange=rMax-rMin||1;return raw.map(p=>({time:p.time,value:clamp01((p.value-rMin)/rRange),curve:0}));}
function genSH(sB,eB){const RATES=[2,1,0.5,0.25,0.125,4/6,2/6,1/6],EPS=0.005,MIN_DELTA=0.15,r4=t=>Math.round(t*10000)/10000,pts=[];let lastV=null,prevRate=null,secStart=sB;while(secStart<eB-1e-4){const secEnd=Math.min((Math.floor(secStart/4)+1)*4,eB);const rate=(prevRate!==null&&Math.random()<0.5)?prevRate:RATES[Math.floor(Math.random()*RATES.length)];prevRate=rate;let t=secStart;while(t<secEnd-1e-4){const stepEnd=Math.min(t+rate,secEnd);let v,tries=0;do{v=Math.random();tries++;}while(lastV!==null&&Math.abs(v-lastV)<MIN_DELTA&&tries<12);lastV=v;const cv=clamp01(v),tA=r4(t);pts.push({time:tA,value:cv,curve:0});const tB=r4(stepEnd-EPS);if(tB>tA)pts.push({time:tB,value:cv,curve:0});t=stepEnd;}secStart=secEnd;}return pts;}
function genReflector(sB,eB,N){const pairs=Math.floor(N/2),flip=Math.random()<0.5,neuroPairs=flip?Math.ceil(pairs/2):Math.floor(pairs/2),chaosPairs=pairs-neuroPairs,mirror=p=>p.map(pt=>({time:pt.time,value:clamp01(1-pt.value),curve:pt.curve?-pt.curve:0})),out=[];for(let i=0;i<neuroPairs;i++){const b=genNeuro(sB,eB);out.push(b);out.push(mirror(b));}for(let i=0;i<chaosPairs;i++){const b=genChaos(sB,eB);out.push(b);out.push(mirror(b));}while(out.length<N)out.push(genNeuro(sB,eB));return out.slice(0,N);}
function mutate(points,beats){const sB=0,eB=beats,dur=eB-sB;let pts=points.filter(pt=>pt.time>=sB&&pt.time<=eB);if(pts.length<2)return points.slice();let norm=pts.map(pt=>({t:(pt.time-sB)/dur,v:pt.value,curve:pt.curve||0}));const numChunks=3+Math.floor(Math.random()*4),chunkSize=1/numChunks;let chunks=[];for(let i=0;i<numChunks;i++){const cS=i*chunkSize,cE=(i+1)*chunkSize;chunks.push(norm.filter(p=>p.t>=cS&&p.t<cE).map(p=>({t:(p.t-cS)/chunkSize,v:p.v,curve:p.curve})));}for(let i=chunks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),tmp=chunks[i];chunks[i]=chunks[j];chunks[j]=tmp;}chunks=chunks.map(chunk=>{if(chunk.length<2)return chunk;if(Math.random()<0.4){chunk=chunk.map(p=>({t:1-p.t,v:p.v,curve:p.curve?-p.curve:0}));chunk.sort((a,b)=>a.t-b.t);}if(Math.random()<0.3)chunk=chunk.map(p=>({t:p.t,v:1-p.v,curve:p.curve?-p.curve:0}));const ampShift=(Math.random()-0.5)*0.6,ampScale=0.6+Math.random()*0.8;chunk=chunk.map(p=>({t:p.t,v:clamp01((p.v-0.5)*ampScale+0.5+ampShift),curve:p.curve}));const timeScale=0.8+Math.random()*0.4,timeOffset=(1-timeScale)*Math.random();return chunk.map(p=>({t:clamp01(p.t*timeScale+timeOffset),v:p.v,curve:p.curve}));});let result=[];chunks.forEach((chunk,i)=>{const cS=i*chunkSize;chunk.forEach(p=>result.push({time:sB+(cS+p.t*chunkSize)*dur,value:p.v,curve:p.curve}));});const newCount=Math.max(1,Math.floor(pts.length*(0.1+Math.random()*0.1)));for(let i=0;i<newCount;i++){const t=sB+Math.random()*dur,nearby=result.reduce((best,p)=>Math.abs(p.time-t)<Math.abs(best.time-t)?p:best,result[0]);result.push({time:t,value:clamp01(nearby.value+(Math.random()-0.5)*0.4),curve:0});}const rm=Math.floor(result.length*(0.1+Math.random()*0.05));for(let i=0;i<rm&&result.length>3;i++){const idx=1+Math.floor(Math.random()*(result.length-2));result.splice(idx,1);}result.sort((a,b)=>a.time-b.time);return result.map(p=>({time:Math.round(Math.max(sB,Math.min(eB,p.time))*10000)/10000,value:clamp01(p.value),curve:p.curve||0}));}
function valueAt(pts,beat){if(!pts||!pts.length)return 0.5;if(beat<=pts[0].time)return pts[0].value;const last=pts[pts.length-1];if(beat>=last.time)return last.value;for(let i=1;i<pts.length;i++){if(pts[i].time>=beat){const a=pts[i-1],b=pts[i],t=(beat-a.time)/((b.time-a.time)||1);return a.value+(b.value-a.value)*t;}}return last.value;}
const GEN_INJECT=withSeed(0x5710DE,()=>{const sB=0,eB=BEATS,sh=[],chaos=[];for(let k=0;k<6;k++){sh.push(genSH(sB,eB));chaos.push(genChaos(sB,eB));}const reflector=genReflector(sB,eB,6),shMut=sh.map(b=>mutate(b,BEATS)),chaosMut=chaos.map(b=>mutate(b,BEATS));return{sh,chaos,reflector,shMut,chaosMut};});
function _injBase(act,k){return act.pat==='reflector'?GEN_INJECT.reflector[k]:act.pat==='chaos'?GEN_INJECT.chaos[k]:GEN_INJECT.sh[k];}
function _injMut(act,k){return act.pat==='chaos'?GEN_INJECT.chaosMut[k]:GEN_INJECT.shMut[k];}
function basePat(act,k,x){return valueAt(_injBase(act,k),clamp(x,0,1)*BEATS);}
// ── real Mutate (mirrors sdMutate): chop into 3-6 chunks, shuffle them, then per-chunk
//    flip (reverse time) / mirror (invert value) / amplitude-scale / time-warp. Deterministic per (act,lane). ──
function rng32(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function buildMutatePlan(seed){const r=rng32(seed),N=3+Math.floor(r()*4),perm=[...Array(N).keys()];
  for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1)),tmp=perm[i];perm[i]=perm[j];perm[j]=tmp;}
  const tf=perm.map(()=>({flip:r()<0.4,mirror:r()<0.3,ampScale:0.6+r()*0.8,ampShift:(r()-0.5)*0.6,timeScale:0.8+r()*0.4,timeOffset:0}));
  tf.forEach(o=>o.timeOffset=(1-o.timeScale)*r());return{N,perm,tf};}
const PLAN={};
function mutatedVal(act,k,x){return valueAt(_injMut(act,k),clamp(x,0,1)*BEATS);}
// mut acts as a left→right "wipe": the curve gets rewritten into its mutated form as the tool processes it.
function laneVal(act,k,x,mut){
  if(act.type!=='double'||mut<=0) return basePat(act,k,x);
  if(mut>=1) return mutatedVal(act,k,x);
  const e=0.035;
  if(x<mut-e) return mutatedVal(act,k,x);
  if(x>mut+e) return basePat(act,k,x);
  return lerp(mutatedVal(act,k,x),basePat(act,k,x),clamp((x-(mut-e))/(2*e),0,1));
}

// ── layout ────────────────────────────────────────────────────────────
const L={ stride:{x:50,y:140,w:980,h:720} };
const HUB={x:L.stride.x+L.stride.w-6, y:L.stride.y+L.stride.h*0.5, r:44};
const C={x:362,y:1024,w:356,h:872};
const colHeaderH=22, clipsTop=C.y+28, slotPitch=30, slotH=26;
function clipRect(i){return {x:C.x+6,y:clipsTop+i*slotPitch,w:C.w-12,h:slotH};}
// generator / tool toolbar inside the Stride panel (the mouse clicks these)
const TOOLBTNS=[{id:'sine',l:'SINE'},{id:'sh',l:'S&H'},{id:'chaos',l:'CHAOS'},{id:'reflect',l:'REFLECT'},{id:'pump',l:'PUMP'},{id:'mutate',l:'MUTATE'},{id:'bloom',l:'BLOOM'}];
const TOOLR=(function(){const p=L.stride,bw=98,gap=8,y=p.y+46,h=30,out={};let x=p.x+24;TOOLBTNS.forEach(b=>{if(b.id==='mutate')x+=18;out[b.id]={x,y,w:bw,h,l:b.l};x+=bw+gap;});return out;})();

// ── acts ──────────────────────────────────────────────────────────────
const ACTS=[
  {pat:'sh',    btn:'sh',     label:'SAMPLE & HOLD', col:AMB,  pts:24600, num:'01', t0:0.0,  type:'double', slotA:0, clipA:'S&H PATTERN', slotB:1, clipB:'S&H · VAR 2'},
  {pat:'chaos', btn:'chaos',  label:'CHAOS LFO',     col:VIO,  pts:41300, num:'02', t0:10.9, type:'double', slotA:2, clipA:'CHAOS LFO',   slotB:3, clipB:'CHAOS · VAR 2'},
  {pat:'reflector', btn:'reflect', label:'REFLECTOR', col:TEAL, pts:33500, num:'03', t0:19.3, type:'single', slotA:4, clipA:'REFLECTOR', slotB:null, clipB:null},
];
const SLOTMAP={};
ACTS.forEach((a,i)=>{a._ai=i;SLOTMAP[a.slotA]={i,v:'A'};if(a.slotB!=null)SLOTMAP[a.slotB]={i,v:'B'};
  if(a.type==='double')for(let k=0;k<6;k++)PLAN[i+'_'+k]=buildMutatePlan((i*97+k*131+7)>>>0);});
const RELD={pick:[0.05,0.5],draw:[0.45,1.85],track:[2.1,3.05],press1:[3.05,3.4],fire1:[3.25,4.45],land1:[3.7,4.8],pressM:[5.15,5.55],mutate:[5.55,6.5],press2:[6.5,6.85],fire2:[6.7,7.9],land2:[7.1,8.15]};
const RELS={pick:[0.05,0.5],draw:[0.45,1.9],track:[2.15,3.1],press1:[3.1,3.45],fire1:[3.3,4.5],land1:[3.75,4.6]};
function rel(i){return ACTS[i].type==='double'?RELD:RELS;}
function win(i,n){const r=rel(i)[n];return r?[ACTS[i].t0+r[0],ACTS[i].t0+r[1]]:null;}
function phA(i,n,t){const w=win(i,n);if(!w)return 0;return clamp((t-w[0])/(w[1]-w[0]||1),0,1);}
function actA(i,n,t){const w=win(i,n);return w?(t>=w[0]&&t<=w[1]):false;}
function actIdx(t){return t>=ACTS[2].t0-0.5?2:t>=ACTS[1].t0-0.5?1:0;}
function mutAt(i,t){const w=win(i,'mutate');if(!w)return 0;if(t<w[0])return 0;if(t>=w[1])return 1;return E.io(clamp((t-w[0])/(w[1]-w[0]),0,1));}
function clipProg(slot,t){const m=SLOTMAP[slot];if(!m)return 0;const w=win(m.i,m.v==='A'?'land1':'land2');if(!w)return 0;return E.out(clamp((t-w[0])/(w[1]-w[0]),0,1));}
function firing(t){for(let i=0;i<3;i++){if(actA(i,'fire1',t))return {i,p:phA(i,'fire1',t),s:ACTS[i].slotA};if(actA(i,'fire2',t))return {i,p:phA(i,'fire2',t),s:ACTS[i].slotB};}return null;}
const CUT1=[8.5,10.9];   // Ableton-timeline cutaway after act 1's injects
const HOOK=[24.3,31.1], LOGO=[30.9,35.1], OUT=[34.9,35.5], LOOP=35.5;
function aw(t,a,b,fin,fout){return E.smooth(clamp((t-a)/fin,0,1))*(1-E.smooth(clamp((t-(b-fout))/fout,0,1)));}

// ── camera ────────────────────────────────────────────────────────────
const CAM=[];
ACTS.forEach((a,i)=>{
  const cyA=clipRect(a.slotA).y+slotH/2, cyB=(a.slotB!=null?clipRect(a.slotB).y+slotH/2:cyA), lx=[380,690,540][i], ly=[300,320,330][i], T0=a.t0;
  CAM.push({t:T0+0.0,x:540,y:480,z:1.12,e:'io'});          // wide — toolbar visible, mouse picks generator
  CAM.push({t:T0+1.85,x:545,y:470,z:1.16,e:'io'});
  CAM.push({t:T0+2.0,x:lx-50,y:ly+30,z:1.35,e:'in'});
  CAM.push({t:T0+2.4,x:lx,y:ly,z:2.5,e:'expoIn'});         // CRASH into lane

    const r=clipRect(i),m=SLOTMAP[i],isT=!!m,vx=r.x,vw=r.w,vy=r.y,vh=r.h,gw=20;
    const a=isT?ACTS[m.i]:null,name=isT?(m.v==='A'?a.clipA:a.clipB):'';
    const fill=isT?clipProg(i,t):0,hot=fill>0.02;
    if(hot){
      ctx.fillStyle='#8c99a6';ctx.fillRect(vx,vy,gw,vh);              // launch gutter
      ctx.fillStyle='#a8b5c1';ctx.fillRect(vx+gw,vy,vw-gw,vh);        // clip body
      if(fill<0.999){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.strokeRect(vx+.75,vy+.75,vw-1.5,vh-1.5);}
      else{ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.strokeRect(vx+.5,vy+.5,vw-1,vh-1);}
      ctx.fillStyle=(i===playing)?'#49ae4b':'#232323';tri(vx+7,vy+vh/2,5);   // launch triangle (green=playing)
      ctx.fillStyle='#1a1a1a';ctx.font='700 11px Outfit';ctx.textBaseline='middle';ctx.fillText(name,vx+gw+5,vy+vh/2);
      if(m.v==='B'){const w2=win(m.i,'land2');if(w2){const fa=aw(t,w2[0],w2[0]+0.6,.08,.4);if(fa>0){ctx.save();ctx.globalAlpha=fa*0.5;ctx.fillStyle='#fff';ctx.fillRect(vx,vy,vw,vh);ctx.restore();}}}
    } else {
      ctx.fillStyle='#474747';ctx.fillRect(vx,vy,vw,vh);
      ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.strokeRect(vx+.5,vy+.5,vw-1,vh-1);
    }
  }
  // stop-button rows (3 dark circles)
  const stopTop=clipsTop+6*slotPitch;
  for(let i=0;i<3;i++){const sy=stopTop+i*(slotH+1),vx=C.x+6,vw=C.w-12;
    ctx.fillStyle='#474747';ctx.fillRect(vx,sy,vw,slotH);ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.strokeRect(vx+.5,sy+.5,vw-1,slotH-1);
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(vx+10,sy+slotH/2,3.8,0,7);ctx.fill();}
  // big empty area
  const sceneY=C.y+C.h*0.45, emptyTop=stopTop+3*(slotH+1)+1;
  ctx.fillStyle='#474747';ctx.fillRect(C.x+6,emptyTop,C.w-12,sceneY-emptyTop-1);
  // scene row: [■] 1 [○] 4
  ctx.fillStyle='#535353';ctx.fillRect(C.x,sceneY,C.w,24);
  ctx.fillStyle='#272727';ctx.fillRect(C.x+8,sceneY+8,9,9);
  ctx.fillStyle='#cfcfcf';ctx.font='700 12px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('1',C.x+C.w*0.34,sceneY+12);
  ctx.strokeStyle='#9a9a9a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(C.x+C.w*0.55,sceneY+12,5,0,7);ctx.stroke();
  ctx.fillStyle='#cfcfcf';ctx.fillText('4',C.x+C.w*0.78,sceneY+12);ctx.textAlign='left';
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(C.x,sceneY+24.5);ctx.lineTo(C.x+C.w,sceneY+24.5);ctx.stroke();
  // ── mixer / IO ──
  const mx=C.x+10,mw=C.w-20;let my=sceneY+40;
  function lbl(s){ctx.fillStyle='#c8c8c8';ctx.font='700 12px Outfit';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(s,mx,my);my+=16;}
  function drop(v){ctx.fillStyle='#636363';ctx.fillRect(mx,my,mw,20);ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.strokeRect(mx+.5,my+.5,mw-1,19);ctx.fillStyle='#dcdcdc';ctx.font='600 12px Outfit';ctx.textBaseline='middle';ctx.fillText(v,mx+7,my+10);ctx.fillStyle='#b8b8b8';ctx.beginPath();ctx.moveTo(mx+mw-16,my+8);ctx.lineTo(mx+mw-8,my+8);ctx.lineTo(mx+mw-12,my+13);ctx.closePath();ctx.fill();my+=24;}
  lbl('MIDI From');drop('All Ins');drop('All Channels');my+=5;
  lbl('Monitor');ctx.font='700 12px Outfit';ctx.textBaseline='middle';let bx=mx;
  [['In',false],['Auto',true],['Off',false]].forEach(([b,on])=>{const tw2=ctx.measureText(b).width+12;if(on){ctx.fillStyle='#c0392b';ctx.fillRect(bx,my-1,tw2,17);ctx.fillStyle='#fff';}else ctx.fillStyle='#c8c8c8';ctx.fillText(b,bx+6,my+8);bx+=tw2+5;});my+=24;
  lbl('Audio To');drop('Main');
  ctx.fillStyle='#636363';ctx.fillRect(mx,my,mw,18);ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.strokeRect(mx+.5,my+.5,mw-1,17);my+=28;
  // Sends
  ctx.fillStyle='#c8c8c8';ctx.font='700 12px Outfit';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('Sends',mx+mw*0.40,my);
  knob(mx+mw*0.30,my+22,'A');knob(mx+mw*0.55,my+34,'B');my+=62;
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(C.x,my);ctx.lineTo(C.x+C.w,my);ctx.stroke();my+=12;
  // volume: -inf pill, pan knob, meter+fader, dB scale, value/S/arm
  ctx.fillStyle='#2c2c2c';rr(mx+2,my,48,16,8);ctx.fill();ctx.fillStyle='#d2d2d2';ctx.font='700 11px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('-∞',mx+26,my+8);ctx.textAlign='left';
  knob(mx+20,my+42,'');
  const fx=mx+mw*0.46,fy=my+2,fh=132;
  ctx.fillStyle='#7d7d7d';tri(fx-12,fy+8,6);                          // meter triangle
  [['0',0.02],['12',.2],['24',.4],['36',.6],['48',.8],['60',1]].forEach(s=>{const yy=fy+fh*s[1];ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fx+6,yy);ctx.lineTo(fx+11,yy);ctx.stroke();ctx.fillStyle='#a6a6a6';ctx.font='600 10px Outfit';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(s[0],fx+15,yy);});
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fx+6,fy);ctx.lineTo(fx+6,fy+fh);ctx.stroke();
  const hy=fy+fh*0.2;ctx.fillStyle='#d2d2d2';rr(fx-1,hy-5,14,10,2);ctx.fill();
  ctx.fillStyle='#444';ctx.fillRect(mx+2,my+64,30,18);ctx.fillStyle='#dcdcdc';ctx.font='700 12px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('6',mx+17,my+73);ctx.textAlign='left';
  ctx.fillStyle='#6f93bb';ctx.fillRect(mx+2,my+87,30,18);ctx.fillStyle='#fff';ctx.font='700 12px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('S',mx+17,my+96);ctx.textAlign='left';
  ctx.fillStyle='#d0492a';ctx.fillRect(mx+2,my+110,30,18);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mx+17,my+119,4.5,0,7);ctx.stroke();
  ctx.restore();
}

// ── Ableton Arrangement cutaway — injected automation lanes in the timeline ──
const TLNAMES=['OSC1 CUTOFF','RESONANCE','OSC2 PITCH','FM AMOUNT','MORPH','DRIVE','WAVEFOLD','SUB LEVEL','NOISE','FILTER ENV','LFO RATE','DELAY MIX','REVERB','WIDTH'];
function tlVal(li,x){const seed=0.13+li*0.41,m=li%3;return m===0?patSH(seed,x):m===1?patChaos(seed,x):reflectSource(x,li);}
function drawTimeline(t,rev){
  ctx.fillStyle='#1f2628';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#2c2f30';ctx.fillRect(0,0,VW,52);                                  // transport bar
  ctx.fillStyle='#cfcfcf';ctx.font='700 18px Outfit';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('Arrangement',28,26);
  ctx.fillStyle='#7e8486';ctx.font='600 14px Outfit';ctx.fillText('6  Serum',180,27);
  const cx=36,cw=VW-72,headY=66,headH=34;
  ctx.fillStyle='#5fbf63';rr(cx,headY,cw,headH,3);ctx.fill();                        // green clip header
  ctx.fillStyle='#10210f';ctx.font='800 15px Outfit';ctx.textBaseline='middle';ctx.fillText('INJECTED CLIP · 14 AUTOMATION LANES',cx+10,headY+headH/2);
  const N=14,top=headY+headH+8,laneH=(1864-top)/N;
  for(let li=0;li<N;li++){
    const ly=top+li*laneH;
    ctx.fillStyle=li%2?'#252c2e':'#212829';ctx.fillRect(cx,ly,cw,laneH-2);
    ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;for(let b=1;b<8;b++){const gx=cx+cw*b/8;ctx.beginPath();ctx.moveTo(gx,ly);ctx.lineTo(gx,ly+laneH-2);ctx.stroke();}
    ctx.fillStyle='#868c8e';ctx.font='700 12px Outfit';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(TLNAMES[li],cx+8,ly+13);
    const lr=E.out(clamp((rev-li*0.022)/0.5,0,1));if(lr<=0)continue;
    const gx0=cx+6,gw=cw-12,gy=ly+18,gh=laneH-26;
    ctx.save();ctx.strokeStyle='#ff5c9c';ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='rgba(255,92,156,.55)';ctx.shadowBlur=6;
    ctx.beginPath();const M=92;for(let s=0;s<=M;s++){const xx=s/M;if(xx>lr)break;const X=gx0+gw*xx,Y=gy+gh-clamp(tlVal(li,xx),0,1)*gh;s===0?ctx.moveTo(X,Y):ctx.lineTo(X,Y);}ctx.stroke();
    ctx.shadowBlur=0;ctx.fillStyle='#ffd0e6';for(let s=0;s<=8;s++){const xx=s/8;if(xx>lr)break;const X=gx0+gw*xx,Y=gy+gh-clamp(tlVal(li,xx),0,1)*gh;ctx.beginPath();ctx.arc(X,Y,1.6,0,7);ctx.fill();}
    ctx.restore();
  }
  const ph=clamp((t-CUT1[0]-0.5)/1.5,0,1),pxx=cx+cw*ph;                              // playhead
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pxx,headY);ctx.lineTo(pxx,top+N*laneH-2);ctx.stroke();
}
// ── overlays ──────────────────────────────────────────────────────────
function setView(){ctx.setTransform(Sv*DPR,0,0,Sv*DPR,0,0);}
function cap(str,sub,a,color,cy){if(a<=0)return;ctx.save();ctx.globalAlpha=E.out(clamp(a,0,1));const ry=lerp(16,0,E.out(clamp(a,0,1)));ctx.textAlign='center';
  ctx.fillStyle=color;ctx.fillRect(540-1,cy-30+ry,2,40);ctx.fillStyle=INK;ctx.font='900 40px Outfit';ctx.textBaseline='alphabetic';ctx.fillText(str,540,cy+ry);
  if(sub){ctx.fillStyle=SUB;ctx.font='600 18px Outfit';ctx.fillText(sub,540,cy+30+ry);}ctx.textAlign='left';ctx.restore();}
function result(clip,pts,isNew,prog,a){if(a<=0)return;ctx.save();ctx.globalAlpha=E.out(clamp(a,0,1));ctx.textAlign='center';
  ctx.fillStyle='#34d399';ctx.font='900 30px Outfit';ctx.fillText((isNew?'NEW CLIP   ':'')+'→ '+clip,540,238);
  const pp=Math.round(20*prog),ptsN=Math.round(pts*prog);
  // big stats — read the data volume instantly
  ctx.fillStyle=INK;ctx.font='900 80px Outfit';ctx.fillText(pp,340,352);
  ctx.fillStyle=SUB;ctx.font='800 17px Outfit';ctx.fillText('PARAMS',340,384);
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(458,308);ctx.lineTo(458,368);ctx.stroke();
  ctx.fillStyle=AMB;ctx.font='900 80px Outfit';ctx.fillText(ptsN.toLocaleString('en-US'),704,352);
  ctx.fillStyle=SUB;ctx.font='800 17px Outfit';ctx.fillText('POINTS',704,384);
  ctx.textAlign='left';ctx.restore();}
function overlays(t){
  ctx=ctxMain;setView();
  const i=actIdx(t),chipA=1-E.smooth(clamp((t-HOOK[0]+0.6)/0.5,0,1));
  if(chipA>0){ctx.save();ctx.globalAlpha=E.out(clamp(chipA,0,1));ctx.textAlign='left';ctx.fillStyle=SUB;ctx.font='800 15px Outfit';ctx.fillText('SCENARIO',70,150);ctx.fillStyle=AMB;ctx.font='900 15px Outfit';ctx.fillText(ACTS[i].num+' / 03',200,150);ctx.restore();}
  for(let s=0;s<3;s++){const a=ACTS[s],t0=a.t0;
    if(a.type==='double'){
      result(a.clipA,a.pts,false,E.out(phA(s,'land1',t)),aw(t,t0+3.8,t0+4.85,.25,.4));
      result(a.clipB,a.pts,true,E.out(phA(s,'land2',t)),aw(t,t0+7.1,t0+8.2,.3,.4));
    } else {
      result(a.clipA,a.pts,false,E.out(phA(s,'land1',t)),aw(t,t0+3.8,t0+4.7,.3,.4));
    }
  }
  // ── cutaway: the injected lanes, in the Ableton timeline ──
  const cutA=aw(t,CUT1[0],CUT1[1],.4,.45);
  if(cutA>0){ctx.save();ctx.globalAlpha=E.out(clamp(cutA,0,1));
    drawTimeline(t,E.out(clamp((t-CUT1[0]-0.35)/0.8,0,1)));
    const fl=aw(t,CUT1[0],CUT1[0]+0.3,.04,.18);if(fl>0){ctx.globalAlpha=E.out(clamp(cutA,0,1))*fl*0.7;ctx.fillStyle='#fff';ctx.fillRect(0,0,VW,VH);}
    ctx.restore();}
  // hook
  const h0=aw(t,24.8,26.9,.45,.5),h1=aw(t,27.0,29.1,.45,.5),h2=aw(t,29.2,31.2,.45,.45);
  if(h0>0||h1>0||h2>0){
    const sg=ctx.createRadialGradient(540,950,160,540,950,820);sg.addColorStop(0,'rgba(7,7,9,'+(0.82*Math.max(h0,h1,h2))+')');sg.addColorStop(1,'rgba(7,7,9,0)');ctx.fillStyle=sg;ctx.fillRect(0,320,VW,1260);
    if(h0>0){ctx.save();ctx.globalAlpha=E.out(clamp(h0,0,1));ctx.textAlign='center';
      ctx.fillStyle=AMB;ctx.font='900 60px Outfit';ctx.fillText('MULTIPLE VARIATIONS',540,852);
      ctx.fillStyle=INK;ctx.font='800 44px Outfit';ctx.fillText('from the same rack —',540,920);ctx.fillText('in just a few clicks.',540,974);ctx.textAlign='left';ctx.restore();}
    if(h1>0){ctx.save();ctx.globalAlpha=E.out(clamp(h1,0,1));ctx.textAlign='center';ctx.fillStyle=SUB;ctx.font='800 36px Outfit';ctx.fillText('IMAGINE THE',540,862);ctx.fillStyle=INK;ctx.font='900 78px Outfit';ctx.fillText('POSSIBILITIES',540,946);ctx.textAlign='left';ctx.restore();}
    if(h2>0){ctx.save();ctx.globalAlpha=E.out(clamp(h2,0,1));ctx.textAlign='center';ctx.fillStyle=COP;ctx.font='900 92px Outfit';ctx.fillText("IT'S ENDLESS.",540,1010);ctx.textAlign='left';ctx.restore();}
  }
  const rg=ctx.createRadialGradient(540,960,420,540,960,1180);rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);
  // ── Stride logo end card ──
  if(t>=LOGO[0]){
    const cA=E.out(clamp((t-LOGO[0])/0.7,0,1));
    if(cA>0){
      ctx.save();ctx.globalAlpha=cA;ctx.fillStyle='#070709';ctx.fillRect(0,0,VW,VH);
      const tw=560,th=tw*1812/2048,cx=540,cy=775,sc=lerp(.86,1,E.back(clamp((t-LOGO[0])/0.8,0,1)));
      ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
      ctx.save();ctx.shadowColor=hexA(COP,.5);ctx.shadowBlur=70;ctx.shadowOffsetY=8;rr(cx-tw/2,cy-th/2,tw,th,30);ctx.fillStyle='#2c2f34';ctx.fill();ctx.restore();
      rr(cx-tw/2,cy-th/2,tw,th,30);ctx.lineWidth=1.5;ctx.strokeStyle=hexA(COP,.5);ctx.stroke();
      if(logoOK){ctx.save();rr(cx-tw/2,cy-th/2,tw,th,30);ctx.clip();ctx.drawImage(logo,cx-tw/2,cy-th/2,tw,th);ctx.restore();}
      ctx.restore();
      const wA=E.out(clamp((t-LOGO[0]-0.35)/0.5,0,1));ctx.globalAlpha=cA*wA;ctx.textAlign='center';
      ctx.fillStyle=INK;ctx.font='900 96px Outfit';ctx.fillText('STRIDE',540,1208);
      ctx.fillStyle=COP;ctx.font='800 28px Outfit';ctx.fillText('SOUND DESIGN ENGINE',540,1258);ctx.textAlign='left';ctx.restore();
    }
  }
  let fade=0;if(t>=OUT[0])fade=clamp((t-OUT[0])/(OUT[1]-OUT[0]),0,1);if(t<0.5)fade=Math.max(fade,1-t/0.5);if(fade>0){ctx.fillStyle='rgba(7,7,9,'+E.out(fade)+')';ctx.fillRect(0,0,VW,VH);}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=.5;ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
}

// ── pipeline ──────────────────────────────────────────────────────────
function drawBackdrop(t){
  ctxMain.setTransform(DPR,0,0,DPR,0,0);ctxMain.globalAlpha=1;
  ctxMain.fillStyle='#08080a';ctxMain.fillRect(0,0,W,H);
  if(ablOK){ctxMain.globalAlpha=0.62;ctxMain.drawImage(ablBg,0,0,W,H);ctxMain.globalAlpha=1;}
  ctxMain.fillStyle='rgba(8,8,11,0.22)';ctxMain.fillRect(0,0,W,H);                  // light dim
  ctxMain.globalCompositeOperation='lighter';                                       // mood glow
  const blobs=[[0.34,0.2,COP,.06],[0.62,0.66,VIO,.05],[0.72,0.22,AMB,.04],[0.28,0.78,TEAL,.04]];
  blobs.forEach((b,i)=>{const cx=(b[0]+Math.sin(t*0.3+i)*0.02)*W,cy=(b[1]+Math.cos(t*0.24+i)*0.02)*H,rad=W*0.55;const rg=ctxMain.createRadialGradient(cx,cy,0,cx,cy,rad);rg.addColorStop(0,hexA(b[2],b[3]));rg.addColorStop(1,hexA(b[2],0));ctxMain.fillStyle=rg;ctxMain.fillRect(0,0,W,H);});
  ctxMain.globalCompositeOperation='source-over';
}
function renderWorld(t){ctx=octx;const cam=camAt(t);octx.setTransform(DPR,0,0,DPR,0,0);octx.clearRect(0,0,W,H);octx.translate(W/2,H/2);octx.scale(cam.z*Sv,cam.z*Sv);octx.translate(-cam.x,-cam.y);
  drawColumn(t);drawCables(t);drawHookCables(t);drawStride(t);drawBead(t);drawCursor(t);}
function composite(t,zb,px,py){ctxMain.setTransform(1,0,0,1,0,0);ctxMain.clearRect(0,0,cv.width,cv.height);
  drawBackdrop(t);ctxMain.setTransform(1,0,0,1,0,0);const Wd=cv.width,Hd=cv.height;
  if(zb<0.004&&Math.abs(px)<1.5&&Math.abs(py)<1.5){ctxMain.globalAlpha=1;ctxMain.drawImage(oc,0,0);return;}
  const n=7;ctxMain.globalAlpha=1/n;for(let k=0;k<n;k++){const f=k/(n-1)-0.5,sc=1+zb*f,dw=Wd*sc,dh=Hd*sc,ox=px*DPR*f*2,oy=py*DPR*f*2;ctxMain.drawImage(oc,(Wd-dw)/2+ox,(Hd-dh)/2+oy,dw,dh);}ctxMain.globalAlpha=1;}
const SLOW=1.2;   // global playback rate — >1 = slower
let start=performance.now(),paused=false,pausedAt=0;
function frame(now){let t=((now-start)/1000/SLOW)%LOOP;const dtv=0.016/SLOW;const c0=camAt(Math.max(0,t-dtv)),c1=camAt(t);
  const zb=clamp(Math.abs(c1.z-c0.z)/c1.z*4.5,0,0.22),px=clamp((c1.x-c0.x)*c1.z*Sv*1.1,-150,150),py=clamp((c1.y-c0.y)*c1.z*Sv*1.1,-160,160);
  renderWorld(t);composite(t,zb,px,py);overlays(t);document.getElementById('tt').textContent=t.toFixed(1)+'s';if(!paused)requestAnimationFrame(frame);}
requestAnimationFrame(frame);
document.getElementById('pp').onclick=function(){paused=!paused;this.textContent=paused?'Play':'Pause';if(!paused){start=performance.now()-pausedAt*1000*SLOW;requestAnimationFrame(frame);}else{pausedAt=((performance.now()-start)/1000/SLOW)%LOOP;}};
document.getElementById('rs').onclick=function(){start=performance.now();pausedAt=0;paused=false;document.getElementById('pp').textContent='Pause';requestAnimationFrame(frame);};
</script>
