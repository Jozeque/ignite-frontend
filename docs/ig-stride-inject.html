<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stride · Inject to every clip — IG composite</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0b0b0d}
  body{font-family:'Outfit',sans-serif}
  #stage{position:relative;width:1917px;height:1029px;overflow:hidden}
  #bg{position:absolute;inset:0;width:1917px;height:1029px;display:block}

  /* Soft grey "blurred" backdrop (replaces flat black; hides the red outline) */
  #void{position:absolute;left:1px;top:20px;width:1451px;height:798px;z-index:1;overflow:hidden;
    background:linear-gradient(140deg,#2a2a30 0%,#1d1d22 52%,#161619 100%)}
  #void .blur{position:absolute;inset:-100px;filter:blur(70px)}
  #void .blur::before{content:'';position:absolute;inset:0;
    background:
      radial-gradient(300px 260px at 22% 30%, rgba(198,113,43,.26), transparent 70%),
      radial-gradient(340px 300px at 70% 74%, rgba(47,116,142,.22), transparent 70%),
      radial-gradient(260px 240px at 52% 16%, rgba(221,154,82,.18), transparent 70%),
      radial-gradient(320px 320px at 82% 44%, rgba(91,123,85,.16), transparent 70%),
      radial-gradient(280px 260px at 12% 78%, rgba(163,78,82,.14), transparent 70%)}
  #void .vig{position:absolute;inset:0;
    background:radial-gradient(125% 118% at 50% 45%, transparent 50%, rgba(0,0,0,.55) 100%)}

  /* Real Stride UI — floating app window on the backdrop */
  #strideui{position:absolute;left:90px;top:176px;width:952px;height:auto;z-index:2;
    border-radius:12px;box-shadow:0 44px 110px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.05),
    0 0 70px -24px rgba(198,113,43,.35)}

  #cables{position:absolute;inset:0;width:1917px;height:1029px;z-index:3;pointer-events:none}

  /* Per-clip inject popups (compact; emerald = the app's success color) */
  .pp{position:absolute;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;gap:9px;
    background:rgba(9,9,11,.95);border:1px solid rgba(16,185,129,.55);border-radius:12px;padding:9px 13px;
    box-shadow:0 16px 44px rgba(0,0,0,.6),0 0 26px -8px rgba(16,185,129,.45);backdrop-filter:blur(8px)}
  .pp .ck{font-size:18px;line-height:1;color:#34d399}
  .pp .clip{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#34d399;margin-bottom:2px}
  .pp .p{font-size:14px;font-weight:800;color:#edeef0;line-height:1.1}
  .pp .d{font-size:11px;font-weight:600;color:#79e2c0;margin-top:1px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="ig-ableton-bg.png" alt="">
  <div id="void"><div class="blur"></div><div class="vig"></div></div>

  <!-- The actual Stride app -->
  <img id="strideui" src="ig-stride-ui.png" alt="">

  <!-- Cables out of the INJECT TO CLIP button -->
  <svg id="cables" viewBox="0 0 1917 1029">
    <defs>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="hubglow">
        <stop offset="0%" stop-color="rgba(221,154,82,.55)"/>
        <stop offset="100%" stop-color="rgba(221,154,82,0)"/>
      </radialGradient>
    </defs>
  </svg>
  <!-- popups injected here -->
</div>

<script>
  const PATCH = ['198,113,43','47,116,142','91,123,85','163,78,82','84,75,109'];

  // HUB = the INJECT TO CLIP button centre, in stage coords.
  // screenshot placed at left:90 top:176, scaled 0.62; button ≈ (1435,490) in its own px.
  const HUB = {x: 90 + 1435*0.62, y: 176 + 490*0.62};   // ≈ (980, 480)
  const clipX = 1451, clipY = [63,81,99,117,135,154,172,190];

  // One popup per cable, scattered down the strip between Stride and the clips.
  const POP = [
    {x:1175, y:105, p:25, pts:'59,254'},
    {x:1330, y:188, p:18, pts:'41,902'},
    {x:1150, y:282, p:31, pts:'72,118'},
    {x:1335, y:362, p:22, pts:'53,640'},
    {x:1175, y:472, p:27, pts:'64,805'},
    {x:1342, y:556, p:14, pts:'33,271'},
    {x:1158, y:655, p:29, pts:'68,449'},
    {x:1330, y:732, p:20, pts:'47,983'},
  ];

  function jack(x,y,r){
    return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#252119" stroke="#6f685e" stroke-width="1.5"/>'
         + '<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.42).toFixed(1)+'" fill="#100f0c"/>'
         + '<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.17).toFixed(1)+'" fill="#bdb6a8"/>';
  }

  const svg = document.getElementById('cables');
  let glowEl = '<circle cx="'+HUB.x.toFixed(0)+'" cy="'+HUB.y.toFixed(0)+'" r="46" fill="url(#hubglow)"/>';
  let cables='', jacks='';
  POP.forEach((P,i)=>{
    const col='rgb('+PATCH[i%PATCH.length]+')';
    const C={x:clipX, y:clipY[i]};
    const k1=Math.max(55,(P.x-HUB.x)*0.55), k2=Math.max(50,(C.x-P.x)*0.5);
    const seg1='M'+HUB.x.toFixed(1)+','+HUB.y.toFixed(1)+' C'+(HUB.x+k1).toFixed(0)+','+HUB.y.toFixed(1)+' '+(P.x-k1).toFixed(0)+','+P.y+' '+P.x+','+P.y;
    const seg2='M'+P.x+','+P.y+' C'+(P.x+k2).toFixed(0)+','+P.y+' '+(C.x-k2).toFixed(0)+','+C.y+' '+C.x+','+C.y;
    [seg1,seg2].forEach(d=>{
      cables+='<path d="'+d+'" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="7" stroke-linecap="round"/>';
      cables+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-opacity="0.9" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>';
    });
    jacks+=jack(clipX,clipY[i],5.5);
  });
  svg.insertAdjacentHTML('beforeend', glowEl+cables+jacks);

  // popups
  const stage=document.getElementById('stage');
  POP.forEach((P,i)=>{
    const d=document.createElement('div');
    d.className='pp';
    d.style.left=P.x+'px'; d.style.top=P.y+'px';
    d.innerHTML='<span class="ck">&#10003;</span><div>'
      +'<div class="clip">Injected · Var '+(i+1)+'</div>'
      +'<div class="p"><b>'+P.p+'</b> params · '+P.pts+' pts</div></div>';
    stage.appendChild(d);
  });
</script>
</body>
</html>
