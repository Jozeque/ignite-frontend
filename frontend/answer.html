<script>
// The answer links in the "One question" mail (a week after a purchase) land here as
// /answer.html?t=<token>&a=yes|some|no plus utm tags. The token is the only credential the
// answer needs, so it is kept for the request below and taken off the URL BEFORE any tag on
// this page reads it: GA4 and Clarity record the address. The answer and the utm tags stay,
// they are what GA4 attributes the visit by. It must stay the first script in <head>.
(function () {
  var s = { token: '', answer: '' };
  try {
    var u = new URL(window.location.href);
    var t = (u.searchParams.get('t') || '').trim().toLowerCase();
    if (/^[0-9a-f]{32}$/.test(t)) s.token = t;
    s.answer = (u.searchParams.get('a') || '').trim().toLowerCase();
    if (u.searchParams.has('t')) {
      u.searchParams.delete('t');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
  } catch (e) {}
  window.STRIDE_SURVEY = s;
})();
</script>

<title>Thanks | Stride</title>

<style>
  :root{
    --bg:#141310; --panel:#1d1b16; --line:rgba(216,201,176,.11);
    --ink:#ece4d6; --ink2:#b8ad9b; --ink3:#857c6e;
    --copper:#c6712b; --copper-lt:#dd9a52; --ember:#e58a2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink2);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px 16px}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% -10%, rgba(198,113,43,.08), transparent 60%)}
  main{position:relative;width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:32px 28px 26px}
  .brand{display:inline-block;font-size:22px;font-weight:900;letter-spacing:-.04em;text-decoration:none;
    background:linear-gradient(90deg,var(--copper-lt),var(--ember));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:22px}
  h1{margin:0 0 10px;color:var(--ink);font-size:26px;line-height:1.2;font-weight:900;letter-spacing:-.02em}

  .quiet{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
  .quiet a{color:var(--copper-lt);text-decoration:none;font-weight:700}
  [data-state="saving"] h1,[data-state="saving"] .sign{opacity:.55}
</style>

<main id="card" data-state="saving">
  <a class="brand" href="/">STRIDE</a>
  <h1 id="title">Thanks.</h1>
  <p id="line">Saving your answer...</p>
  <p class="sign">Joe</p>
  <p class="quiet">Setting something up? <a href="/setup.html">The setup guide</a></p>
</main>
<script>
// One request: the answer and the token from the head script. The first answer is the one
// the backend keeps; a second click reads back what is on record. Whatever happens, the buyer
// reads a thank-you and never an error.
(function () {
  var API = 'https://generate-midi-z3spyrafvq-uc.a.run.app';
  var COPY = {
    yes: ['Glad to hear it.',
          "If you make something with it, reply to my email and send it over. I'd love to hear it."],
    some: ['Thanks, that helps.',
           "What's still in the way? Reply to my email and tell me. I read every one, and I'll help you get there."],
    no: ['Thanks for being straight with me.',
         "Reply to my email and tell me what got in the way. I'll help you get Stride into your sessions."],
    again: ['Already got it, thanks.',
            'Your first answer is the one I kept. Anything to add? Reply to my email, I read every one.'],
    fallback: ['Thanks.',
               "If your answer didn't come through, just reply to my email with it. I read every one."]
  };
  var shown = false;
  function show(key) {
    if (shown) return;
    shown = true;
    var c = COPY[key] || COPY.fallback;
    document.querySelector('#title').textContent = c[0];
    document.querySelector('#line').textContent = c[1];
    document.querySelector('#card').setAttribute('data-state', key);
  }
  var s = window.STRIDE_SURVEY || {};
  var answer = (s.answer === 'yes' || s.answer === 'some' || s.answer === 'no') ? s.answer : '';
  if (!answer || !s.token) { show('fallback'); return; }
  // A slow backend must not leave the card on "Saving" forever. The answer can still land.
  setTimeout(function () { show('fallback'); }, 8000);
  try {
    fetch(API, {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'survey_answer', token: s.token, answer: answer })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok && res.status === 'recorded') show(answer);
      else if (res && res.ok && res.status === 'answered') show('again');
      else show('fallback');
    }).catch(function () { show('fallback'); });
  } catch (e) { show('fallback'); }
})();
</script>
