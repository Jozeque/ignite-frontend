<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride · Carousel Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  /* ── Stride brand core (pulled from frontend/index.html) ── */
  --bg:#141310; --bg2:#191611; --panel:#1d1b16; --raise:#252119; --line:rgba(216,201,176,.11);
  --ink:#ece4d6; --ink2:#b8ad9b; --ink3:#857c6e;
  --copper:#c6712b; --copper-lt:#dd9a52; --amber:#d9822b; --ember:#e58a2e;
  --teal:#2f748e; --teal-lt:#5e9aad;
  --well:#100f0c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Outfit',sans-serif;color:var(--ink2);
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(198,113,43,.06), transparent 60%),
    radial-gradient(100% 60% at 50% 110%, rgba(47,116,142,.04), transparent 60%),
    var(--bg2);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;
}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.silk{font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--ink3)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.32;cursor:default}

/* ── App chrome ── */
header{
  display:flex;align-items:center;gap:18px;padding:14px 22px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--bg);
  flex:0 0 auto;
}
.logo{display:flex;align-items:center;gap:11px}
.logo .dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0bd83,var(--copper));box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 14px rgba(198,113,43,.5)}
.logo b{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--ink);text-transform:uppercase}
.logo span{color:var(--ink3)}
.spacer{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink3);font-weight:800;font-size:12px;letter-spacing:.06em;padding:7px 13px;border-radius:8px;transition:.15s}
.seg button.on{background:linear-gradient(180deg,var(--ember),var(--copper));color:#1c1206}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);color:var(--ink2);
  font-weight:800;letter-spacing:.03em;font-size:13px;padding:9px 15px;border-radius:11px;transition:.15s}
.btn:hover:not(:disabled){color:var(--ink);border-color:rgba(216,201,176,.22)}
.btn-copper{border:1px solid rgba(255,210,150,.25);background:linear-gradient(180deg,var(--ember),var(--copper));color:#1c1206;font-weight:900;letter-spacing:.04em}
.btn-copper:hover:not(:disabled){filter:brightness(1.06)}

main{flex:1;display:flex;min-height:0}

/* ── Slide rail ── */
#rail{flex:0 0 196px;border-right:1px solid var(--line);background:rgba(0,0,0,.12);
  display:flex;flex-direction:column;min-height:0}
#rail .rail-h{padding:13px 16px 9px;display:flex;align-items:center;justify-content:space-between}
#thumbs{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);transition:.15s}
.thumb.active{border-color:var(--copper);box-shadow:0 0 0 1px var(--copper),0 8px 24px -12px rgba(198,113,43,.6)}
.thumb-scaler{position:relative;overflow:hidden;cursor:pointer;display:block}
.thumb-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-top:1px solid var(--line);background:var(--panel)}
.thumb-n{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink3);font-weight:700}
.thumb-acts{display:flex;gap:2px}
.thumb-acts button{width:22px;height:22px;border:0;background:transparent;color:var(--ink3);border-radius:6px;font-size:12px;line-height:1}
.thumb-acts button:hover:not(:disabled){background:var(--raise);color:var(--ink)}

/* ── Editor ── */
#editor{flex:1;display:flex;min-width:0}
#preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto;min-width:0}
#preview-scaler{position:relative;flex:0 0 auto;filter:drop-shadow(0 40px 80px rgba(0,0,0,.55))}
#slide-preview{position:absolute;top:0;left:0;transform-origin:top left}

#controls{flex:0 0 332px;border-left:1px solid var(--line);background:rgba(0,0,0,.12);
  padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{display:flex;align-items:center;justify-content:space-between}
.field input,.field textarea{
  font-family:'Outfit',sans-serif;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:14px;resize:none;outline:none;transition:.15s;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(198,113,43,.14)}
.field textarea{line-height:1.4}
.hint{font-size:11px;color:var(--ink3);line-height:1.5}

.drop{border:1.5px dashed var(--line);border-radius:13px;background:var(--well);
  aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:.15s;text-align:center;padding:12px;position:relative;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat}
.drop:hover,.drop.over{border-color:var(--copper);background-color:rgba(198,113,43,.06)}
.drop.has{border-style:solid}
.drop .dz-ico{font-size:22px;opacity:.6}
.drop .dz-t{font-size:12.5px;font-weight:700;color:var(--ink2)}
.drop .dz-s{font-size:10.5px;color:var(--ink3)}
.img-row{display:flex;gap:8px}
.img-row .btn{flex:1;justify-content:center;font-size:12px;padding:8px}

.section-t{font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:var(--copper-lt);margin-bottom:-4px}
.foot-note{font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px;line-height:1.6}
.foot-note b{color:var(--ink2)}

/* busy overlay */
#busy{position:fixed;inset:0;background:rgba(10,9,7,.78);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50}
#busy.on{display:flex}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(216,201,176,.18);border-top-color:var(--copper-lt);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busy .t{font-weight:800;color:var(--ink);letter-spacing:.04em}

/* offscreen export stage */
#stage{position:fixed;left:-12000px;top:0;pointer-events:none}

/* ════════ THE SLIDE (export-fidelity artwork) ════════ */
.slide{position:relative;background:var(--bg);overflow:hidden;font-family:'Outfit',sans-serif;color:var(--ink2)}
.slide .s-bg{position:absolute;inset:0;
  background:
    radial-gradient(120% 78% at 50% -8%, rgba(198,113,43,.14), transparent 58%),
    radial-gradient(100% 60% at 50% 112%, rgba(47,116,142,.07), transparent 60%);}
.slide .s-inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:84px 84px 74px}
.slide .s-top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.slide .s-brand{display:flex;align-items:center;gap:16px;font-family:'Space Mono',monospace;font-weight:700;
  font-size:27px;letter-spacing:.26em;color:var(--ink);text-transform:uppercase}
.slide .s-bdot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3c089,var(--copper));
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 18px rgba(198,113,43,.55)}
.slide .s-step{font-family:'Space Mono',monospace;font-weight:700;font-size:23px;letter-spacing:.26em;
  color:var(--copper-lt);text-transform:uppercase}
.slide .s-well{flex:1 1 auto;margin-top:54px;border-radius:26px;background:var(--well);
  border:1px solid rgba(198,113,43,.20);background-size:contain;background-position:center;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),inset 0 2px 30px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.slide .s-well.cover{background-size:cover}
.slide .s-well .s-empty-t{font-family:'Space Mono',monospace;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:rgba(133,124,110,.5)}
.slide .s-text{flex:0 0 auto;margin-top:52px}
.slide .s-rule{width:66px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--copper-lt),var(--ember));margin-bottom:30px}
.slide .s-headline{margin:0;font-weight:900;font-size:62px;line-height:1.04;letter-spacing:-.02em;color:var(--ink)}
.slide .s-cap{margin:22px 0 0;font-weight:400;font-size:31px;line-height:1.4;color:var(--ink2)}
.slide .s-foot{flex:0 0 auto;margin-top:auto;padding-top:44px;display:flex;align-items:center;justify-content:space-between}
.slide .s-dots{display:flex;align-items:center;gap:11px}
.slide .s-dot{width:11px;height:11px;border-radius:50%;background:rgba(216,201,176,.20)}
.slide .s-dot.on{width:30px;border-radius:6px;background:linear-gradient(90deg,var(--copper-lt),var(--ember))}
.slide .s-handle{font-family:'Space Mono',monospace;font-weight:700;font-size:19px;letter-spacing:.2em;color:var(--ink3);text-transform:lowercase}
/* square tightens vertical rhythm a touch */
.slide.fmt-1x1 .s-well{margin-top:42px}
.slide.fmt-1x1 .s-text{margin-top:40px}
.slide.fmt-1x1 .s-headline{font-size:56px}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span><b>Stride</b> <span class="silk" style="margin-left:4px">Carousel Builder</span></div>
  <div class="spacer"></div>
  <span id="count" class="silk"></span>
  <div class="seg" id="fmt">
    <button data-fmt="4x5">4:5</button>
    <button data-fmt="1x1">1:1</button>
  </div>
  <button class="btn" id="add">＋ Slide</button>
  <button class="btn btn-copper" id="dl-all">↓ Download all</button>
</header>

<main>
  <aside id="rail">
    <div class="rail-h"><span class="silk">Slides</span></div>
    <div id="thumbs"></div>
  </aside>

  <section id="editor">
    <div id="preview-wrap">
      <div id="preview-scaler"><div id="slide-preview" class="slide"></div></div>
    </div>

    <div id="controls">
      <div class="section-t">Slide content</div>

      <div class="field">
        <label><span class="silk">Step label</span></label>
        <input id="in-step" type="text" maxlength="24" placeholder="STEP 01">
      </div>

      <div class="field">
        <label><span class="silk">Headline</span></label>
        <textarea id="in-headline" rows="2" placeholder="Short, punchy line"></textarea>
      </div>

      <div class="field">
        <label><span class="silk">Caption</span> <span class="hint">optional</span></label>
        <textarea id="in-caption" rows="2" placeholder="One line of context (optional)"></textarea>
      </div>

      <div class="section-t" style="margin-top:4px">Screenshot</div>
      <div class="field">
        <div class="drop" id="drop">
          <div class="dz-ico">🖼</div>
          <div class="dz-t">Click, drop, or paste</div>
          <div class="dz-s">PNG / JPG · ⌘/Ctrl+V to paste</div>
        </div>
        <div class="img-row">
          <div class="seg" style="flex:1" id="fit">
            <button data-fit="contain" style="flex:1">Fit</button>
            <button data-fit="cover" style="flex:1">Fill</button>
          </div>
          <button class="btn" id="img-clear">Remove</button>
        </div>
      </div>

      <button class="btn btn-copper" id="dl-one" style="justify-content:center;margin-top:2px">↓ Download this slide</button>

      <div class="foot-note">
        Exports at <b>2×</b> for crisp text — <b>2160×2700</b> (4:5) or <b>2160×2160</b> (1:1).
        Drop the PNGs straight into an Instagram carousel. Work auto-saves to this browser.
      </div>
    </div>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>

<div id="busy"><div class="spin"></div><div class="t" id="busy-t">Rendering…</div></div>
<div id="stage"></div>

<script>
const $ = s => document.querySelector(s);
const FORMATS = { '4x5':{w:1080,h:1350}, '1x1':{w:1080,h:1080} };
const LS_KEY = 'stride_carousel_v1';

function uid(){ return 's'+Math.random().toString(36).slice(2,9); }

function seed(){
  const mk=(step,headline,caption)=>({id:uid(),step,headline,caption,image:null,fit:'contain'});
  return { format:'4x5', current:0, slides:[
    mk('STEP 01','Drop StrideLink onto your track','Add the StrideLink device to any track in Live.'),
    mk('STEP 02','Map the rack you want to move','Hit Scan Mapped and your macros load in.'),
    mk('STEP 03','Shape the motion','Draw a curve or drop in a Motion preset.'),
    mk('STEP 04','Inject straight to your clip','One click and the automation is in your clip.'),
  ]};
}
function load(){ try{ const v=JSON.parse(localStorage.getItem(LS_KEY)); return v&&v.slides&&v.slides.length?v:null; }catch(e){ return null; } }
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ try{ localStorage.setItem(LS_KEY, JSON.stringify({...state, slides:state.slides.map(s=>({...s,image:null}))})); }catch(_){} }
}
let state = load() || seed();
if(state.current>=state.slides.length) state.current=0;

/* ── escaping + multiline ── */
function esc(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escML(t){ return esc(t).replace(/\n/g,'<br>'); }

/* ── build slide markup ── */
function slideInner(s, idx, total, showPlaceholder){
  const dots = Array.from({length:total},(_,i)=>`<span class="s-dot${i===idx?' on':''}"></span>`).join('');
  const bg = s.image ? `style="background-image:url('${s.image}')"` : '';
  const empty = (!s.image && showPlaceholder) ? '<span class="s-empty-t">Screenshot</span>' : '';
  const cap = s.caption ? `<p class="s-cap">${escML(s.caption)}</p>` : '';
  return `
    <div class="s-bg"></div>
    <div class="s-inner">
      <div class="s-top">
        <div class="s-brand"><span class="s-bdot"></span>Stride</div>
        <div class="s-step">${esc(s.step)}</div>
      </div>
      <div class="s-well ${s.fit||'contain'}" ${bg}>${empty}</div>
      <div class="s-text">
        <div class="s-rule"></div>
        <h2 class="s-headline">${escML(s.headline)}</h2>
        ${cap}
      </div>
      <div class="s-foot">
        <div class="s-dots">${dots}</div>
        <div class="s-handle">stridehub.io</div>
      </div>
    </div>`;
}

/* ── renders ── */
function renderPreview(){
  const f=FORMATS[state.format];
  const wrap=$('#preview-wrap');
  const maxW=Math.max(120, wrap.clientWidth-60);
  const maxH=Math.max(120, wrap.clientHeight-60);
  const k=Math.min(maxW/f.w, maxH/f.h);
  const sl=$('#slide-preview');
  sl.className='slide fmt-'+state.format;
  sl.style.width=f.w+'px'; sl.style.height=f.h+'px'; sl.style.transform='scale('+k+')';
  sl.innerHTML=slideInner(state.slides[state.current], state.current, state.slides.length, true);
  $('#preview-scaler').style.width=(f.w*k)+'px';
  $('#preview-scaler').style.height=(f.h*k)+'px';
}
function renderRail(){
  const f=FORMATS[state.format]; const k=164/f.w;
  const rail=$('#thumbs'); rail.innerHTML='';
  state.slides.forEach((s,i)=>{
    const item=document.createElement('div');
    item.className='thumb'+(i===state.current?' active':'');
    item.innerHTML=`
      <div class="thumb-scaler" style="width:${f.w*k}px;height:${f.h*k}px">
        <div class="slide fmt-${state.format}" style="width:${f.w}px;height:${f.h}px;transform:scale(${k});transform-origin:top left;position:absolute;top:0;left:0">${slideInner(s,i,state.slides.length,true)}</div>
      </div>
      <div class="thumb-bar">
        <span class="thumb-n">${String(i+1).padStart(2,'0')}</span>
        <div class="thumb-acts">
          <button data-act="up" ${i===0?'disabled':''} title="Move up">↑</button>
          <button data-act="down" ${i===state.slides.length-1?'disabled':''} title="Move down">↓</button>
          <button data-act="del" ${state.slides.length<=1?'disabled':''} title="Delete">✕</button>
        </div>
      </div>`;
    item.querySelector('.thumb-scaler').onclick=()=>{ state.current=i; sync(); };
    item.querySelectorAll('[data-act]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); act(b.dataset.act,i); });
    rail.appendChild(item);
  });
}
function renderControls(){
  const s=state.slides[state.current];
  $('#in-step').value=s.step||'';
  $('#in-headline').value=s.headline||'';
  $('#in-caption').value=s.caption||'';
  const drop=$('#drop');
  if(s.image){ drop.classList.add('has'); drop.style.backgroundImage=`url('${s.image}')`; }
  else { drop.classList.remove('has'); drop.style.backgroundImage=''; }
  $('#img-clear').disabled=!s.image;
  $('#fit').querySelectorAll('[data-fit]').forEach(b=>b.classList.toggle('on', b.dataset.fit===(s.fit||'contain')));
  $('#fmt').querySelectorAll('[data-fmt]').forEach(b=>b.classList.toggle('on', b.dataset.fmt===state.format));
  $('#count').textContent=state.slides.length+(state.slides.length===1?' slide':' slides');
}
function sync(){ renderPreview(); renderRail(); renderControls(); save(); }

/* ── actions ── */
function act(type,i){
  if(type==='up' && i>0){ [state.slides[i-1],state.slides[i]]=[state.slides[i],state.slides[i-1]]; if(state.current===i)state.current=i-1; else if(state.current===i-1)state.current=i; }
  if(type==='down' && i<state.slides.length-1){ [state.slides[i+1],state.slides[i]]=[state.slides[i],state.slides[i+1]]; if(state.current===i)state.current=i+1; else if(state.current===i+1)state.current=i; }
  if(type==='del' && state.slides.length>1){ state.slides.splice(i,1); if(state.current>=state.slides.length)state.current=state.slides.length-1; }
  sync();
}
function addSlide(){
  const n=state.slides.length+1;
  state.slides.push({id:uid(),step:'STEP '+String(n).padStart(2,'0'),headline:'New step',caption:'',image:null,fit:'contain'});
  state.current=state.slides.length-1; sync();
}

/* ── image input ── */
function setImage(dataURL){ state.slides[state.current].image=dataURL; sync(); }
function readFile(file){ if(!file||!/^image\//.test(file.type))return; const r=new FileReader(); r.onload=()=>setImage(r.result); r.readAsDataURL(file); }

$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ readFile(e.target.files[0]); e.target.value=''; };
['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over');}));
$('#drop').addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
$('#img-clear').onclick=()=>{ state.slides[state.current].image=null; sync(); };
window.addEventListener('paste',e=>{
  const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));
  if(it) readFile(it.getAsFile());
});

/* ── input bindings ── */
$('#in-step').addEventListener('input',e=>{ state.slides[state.current].step=e.target.value; renderPreview(); renderRail(); save(); });
$('#in-headline').addEventListener('input',e=>{ state.slides[state.current].headline=e.target.value; renderPreview(); renderRail(); save(); });
$('#in-caption').addEventListener('input',e=>{ state.slides[state.current].caption=e.target.value; renderPreview(); renderRail(); save(); });
$('#fit').querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{ state.slides[state.current].fit=b.dataset.fit; sync(); });
$('#fmt').querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{ state.format=b.dataset.fmt; sync(); });
$('#add').onclick=addSlide;

/* ── export ── */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function fontsReady(){ return document.fonts? document.fonts.ready : Promise.resolve(); }
function preloadImg(src){ return new Promise(res=>{ if(!src)return res(); const im=new Image(); im.onload=im.onerror=()=>res(); im.src=src; }); }

async function exportOne(i){
  const f=FORMATS[state.format];
  const stage=$('#stage');
  stage.innerHTML=`<div class="slide fmt-${state.format}" style="width:${f.w}px;height:${f.h}px">${slideInner(state.slides[i],i,state.slides.length,false)}</div>`;
  await fontsReady(); await preloadImg(state.slides[i].image); await raf();
  const node=stage.firstElementChild;
  const canvas=await html2canvas(node,{scale:2,backgroundColor:'#141310',useCORS:true,logging:false,width:f.w,height:f.h,windowWidth:f.w,windowHeight:f.h});
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  stage.innerHTML='';
  return blob;
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function setBusy(on,t){ $('#busy').classList.toggle('on',on); if(t)$('#busy-t').textContent=t; }
function noLib(){ if(typeof html2canvas==='undefined'){ alert('Export needs an internet connection (the renderer failed to load). Reconnect and reload.'); return true; } return false; }

$('#dl-one').onclick=async()=>{
  if(noLib())return; setBusy(true,'Rendering slide…');
  try{ const b=await exportOne(state.current); downloadBlob(b,`stride-${String(state.current+1).padStart(2,'0')}.png`); }
  catch(e){ alert('Render failed: '+e.message); } finally{ setBusy(false); }
};
$('#dl-all').onclick=async()=>{
  if(noLib())return;
  for(let i=0;i<state.slides.length;i++){
    setBusy(true,`Rendering ${i+1} / ${state.slides.length}…`);
    try{ const b=await exportOne(i); downloadBlob(b,`stride-carousel-${String(i+1).padStart(2,'0')}.png`); await sleep(380); }
    catch(e){ console.error(e); }
  }
  setBusy(false);
};

/* ── boot ── */
window.addEventListener('resize',renderPreview);
fontsReady().then(renderPreview);
sync();
</script>
</body>
</html>
