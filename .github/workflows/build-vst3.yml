name: Build Stride VST3 (Win + Mac)

# Builds the cross-DAW Stride VST3 wrapper for BOTH platforms from the same
# commit, so Windows and Mac always stay 1:1.
#   - windows: cmake build -> Stride.vst3 -> zip artifact
#   - mac:     cmake universal build -> Developer ID codesign (hardened +
#              disable-library-validation) -> notarize (--wait) -> staple -> zip
#
# The Mac job reuses the SAME Apple secrets as the desktop build-mac.yml.
# Single Mac job (not the desktop's 2-job split) because the Apple account is
# already warmed up by desktop notarizations, so notarytool --wait is minutes.
#
# Trigger: manual (Actions -> Run workflow) or push a `vst3-v*` tag (kept
# separate from the desktop's `v*` so the two release pipelines never collide).

on:
  workflow_dispatch:
  push:
    tags:
      - 'vst3-v*'

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Windows VST3
  # ──────────────────────────────────────────────
  windows:
    name: Windows VST3
    runs-on: windows-2022   # has Visual Studio 2022 (the "17 2022" generator); windows-latest moved to a newer image
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure + build VST3
        working-directory: stride-wrapper/m0-spike
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target StrideWrapperM0_VST3
          # Stride FX: the same sources declared as an audio effect, so it can sit on an
          # audio track or the master. Ships in the SAME zip at no extra charge.
          cmake --build build --config Release --target StrideWrapperFx_VST3

      - name: Zip VST3
        working-directory: stride-wrapper/m0-spike
        shell: bash
        run: |
          # Bake the CMake project version into the zip name — the file identifies its
          # build, so a tester's download can never be mistaken for another version.
          VER="$(sed -n 's/^project(StrideWrapperM0 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$VER" ] || { echo "version not found in CMakeLists.txt"; exit 1; }
          echo "STRIDE_VER=$VER" >> "$GITHUB_ENV"
          VST3="$(find build -name 'Stride.vst3' -type d | head -1)"
          [ -n "$VST3" ] || { echo "Stride.vst3 not found"; find build -name '*.vst3'; exit 1; }
          FX3="$(find build -name 'Stride FX.vst3' -type d | head -1)"
          [ -n "$FX3" ] || { echo "Stride FX.vst3 not found"; find build -name '*.vst3'; exit 1; }
          echo "Found: $VST3 (v$VER)"
          echo "Found: $FX3 (v$VER)"
          FX3_ABS="$(cd "$FX3/.." && pwd)/Stride FX.vst3"
          cd "$(dirname "$VST3")"
          # The two plugins build into separate artefact trees, so the FX bundle is staged
          # next to the instrument for zipping. Both, one download, one license.
          cp -r "$FX3_ABS" .
          cp "$GITHUB_WORKSPACE/stride-wrapper/m0-spike/ci/README.txt" .
          # StrideBridge rides along: the M4L output stage that lets Stride modulate
          # Ableton's own devices. Self-contained folder - the amxd resolves its js
          # files next to itself, and the VST link runs on Node built-ins (no npm).
          mkdir -p StrideBridge
          for f in StrideBridge.amxd bridge-server.js bridge_max.js rasterizer.js log-scaling.js inject-writer.js; do
            cp "$GITHUB_WORKSPACE/stride-vst/m4l-bridge/$f" StrideBridge/
          done
          # StrideInject rides along too. It is the Remote Script that actually writes
          # the clip automation, and until now the ONLY way to get it was the desktop
          # app's "Install to Ableton" - so a VST + StrideBridge user had no route to it
          # at all, and a StrideLink user was stuck on an old copy that cannot hand a
          # knob back or resolve a hosted macro.
          mkdir -p StrideBridge/StrideInject
          cp "$GITHUB_WORKSPACE/stride-vst/remote_script/StrideInject/__init__.py" StrideBridge/StrideInject/
          cp "$GITHUB_WORKSPACE/stride-vst/remote_script/StrideInject/_curve.py" StrideBridge/StrideInject/
          cp "$GITHUB_WORKSPACE/stride-vst/m4l-bridge/README-StrideBridge.txt" StrideBridge/README.txt
          cp "$GITHUB_WORKSPACE/docs/_fonts/Outfit.ttf" StrideBridge/
          7z a -tzip "$GITHUB_WORKSPACE/Stride-VST3-Windows-v$VER.zip" "Stride.vst3" "Stride FX.vst3" "README.txt" "StrideBridge" >/dev/null
          echo "Zipped Stride-VST3-Windows-v$VER.zip"

      # The ARTIFACT name carries the version too — GitHub's browser download wraps the
      # artifact in a zip named after it, so an unversioned artifact name would hand the
      # user an unversioned file no matter what the zip inside is called.
      - uses: actions/upload-artifact@v4
        with:
          name: Stride-VST3-Windows-v${{ env.STRIDE_VER }}
          path: Stride-VST3-Windows-v*.zip
          retention-days: 90
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # macOS VST3 (universal, signed + notarized)
  # ──────────────────────────────────────────────
  mac:
    name: macOS VST3 (signed + notarized)
    runs-on: macos-14   # Apple Silicon runner; we build universal anyway
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || { echo "no Developer ID"; exit 1; }

      - name: Build + sign + notarize + staple
        working-directory: stride-wrapper/m0-spike
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ci/build-mac-vst3.sh

      - name: Read version for the artifact name
        working-directory: stride-wrapper/m0-spike
        shell: bash
        run: |
          VER="$(sed -n 's/^project(StrideWrapperM0 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$VER" ] || { echo "version not found in CMakeLists.txt"; exit 1; }
          echo "STRIDE_VER=$VER" >> "$GITHUB_ENV"

      # Versioned artifact name — see the Windows job's note (browser downloads are
      # named after the ARTIFACT, not the zip inside it).
      - uses: actions/upload-artifact@v4
        with:
          name: Stride-VST3-Mac-v${{ env.STRIDE_VER }}
          path: stride-wrapper/m0-spike/dist-mac/*.zip
          retention-days: 90
          if-no-files-found: error
