<title>STRIDE | Chains moved</title>

<!-- This page's content moved onto the Experimental Collection page on 2026-09-08:
     the install paths, and the free files. It is a redirect rather than a deletion
     because the URL is in the wild (it was linked from the nav and the footer for
     months) and a 404 would be a worse answer than the right page.

     GitHub Pages serves static files only, so there is no server-side 301 to give.
     Canonical + meta refresh + a JS replace is the static equivalent: search engines
     follow the canonical, humans get moved immediately, and the back button still
     works because replace() does not add a history entry. -->
<link rel="canonical" href="https://stridehub.io/samples.html">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=samples.html">
<script>location.replace('samples.html' + location.hash);</script>

       background:var(--bg);color:var(--ink3);font-family:system-ui,-apple-system,sans-serif;
       text-align:center;padding:2rem;line-height:1.6}
  a{color:var(--copper-lt)}
</style>
</head>

</body>
