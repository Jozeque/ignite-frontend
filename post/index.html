<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Stride</title>
<!-- /post/ was the 1:1 session's offer screen in the post-purchase run. The session is no longer offered
     (Yossi 2026-11-07), so anyone sent here (an open tab, an old link) goes on to the welcome page, which
     reads the purchase from this tab's sessionStorage as before. -->
<meta http-equiv="refresh" content="0; url=/welcome.html">
<script>location.replace('/welcome.html');</script>
<style>html,body{margin:0;background:#141310}</style>
<meta property="og:image" content="https://stridehub.io/media/stride/og/stride-share-1200x630.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Stride, the sound design engine: every lane of the chain in motion">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://stridehub.io/media/stride/og/stride-share-1200x630.jpg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script>window.STRIDE_LANGS=["en"]</script>
<script>(function () {
  var view = null, pressed = {};
  // This page view: its page key, channel, ad id and Meta-id flag, read once.
  function read() {
    if (view) return view;
    var L = ["de","es","fr","it","ja","zh"], K = {"":"home","try":"try","samples":"samples","setup":"setup","session":"session","welcome":"welcome","post":"post","post2":"post2","tendril":"tendril","blog":"blog","tv":"tv","tools":"tool","vst3":"how","how-it-works":"how","privacy":"legal","terms":"legal","refund":"legal"};
    var path = location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '').replace(/\/+$/, '');
    var seg = path.split('/');
    if (seg[1] && L.indexOf(seg[1]) >= 0) seg.splice(1, 1);
    var first = seg[1] || '';
    var p = Object.prototype.hasOwnProperty.call(K, first) ? K[first] : 'other';
    var q = new URLSearchParams(location.search), rh = '';
    try { rh = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
    var nav = (window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
    var here = location.hostname.replace(/^www\./, ''), c = 'direct', a = '', m = 0;
    if (nav.type === 'reload' || nav.type === 'back_forward' || (rh && rh.replace(/^www\./, '') === here)) c = 'internal';
    else {
      var ad = (q.get('ad_id') || '').trim(), s = (q.get('utm_source') || '').trim().toLowerCase();
      var fromMeta = /^(fb|ig|msg|an|meta|facebook|instagram)$/.test(s), mid = (q.get('utm_content') || '').trim();
      if (/^\d{6,24}$/.test(ad)) { c = 'meta'; a = ad; }
      else if (q.get('gclid') || q.get('wbraid') || q.get('gbraid')) c = 'google';
      else if (fromMeta && /^\d{6,24}$/.test(mid)) { c = 'meta'; a = mid; m = 1; }
      else if (fromMeta && (q.get('utm_campaign') || '').indexOf('|') >= 0) c = 'meta';
      else if (/^(stride|email|newsletter|resend|mail)$/.test(s)) c = 'email';
      else if (/^(ig|instagram|insta|ig_bio|instagram_bio)$/.test(s)) c = 'ig';
      else if (/^(yt|youtube)$/.test(s)) c = 'yt';
      else if (/^(google|adwords|google_ads|gads)$/.test(s)) c = 'google';
      else if (/^(facebook|fb|meta)$/.test(s) || q.get('fbclid')) c = 'meta';
      else if (/(^|\.)instagram\.com$/.test(rh)) c = 'ig';
      else if (/(^|\.)(youtube\.com|youtu\.be)$/.test(rh)) c = 'yt';
    }
    view = { p: p, c: c, a: a, m: m };
    return view;
  }
  function send() {
    try {
      if (!navigator.sendBeacon) return;
      var v = read(), body = { action: 'pv', p: v.p, c: v.c, a: v.a };
      if (v.m) body.m = 1;
      navigator.sendBeacon("https://generate-midi-z3spyrafvq-uc.a.run.app", JSON.stringify(body));
    } catch (e) {}
  }
  // A funnel step by the name the Clarity block gives it, counted when it is a press on the buy path.
  var STEP = {"buy_form_open":"cta","paypal_button":"pay","wallet_payment_selected":"pay","wallet_payment_started":"pay","checkout_loaded":"co"};
  window.strideStep = function (name) {
    try {
      var s = STEP[name];
      if (!s || pressed[s] || !navigator.sendBeacon) return;
      pressed[s] = 1;
      navigator.sendBeacon("https://generate-midi-z3spyrafvq-uc.a.run.app", JSON.stringify({ action: 'fs', s: s, c: read().c }));
    } catch (e) {}
  };
  if (document.prerendering) document.addEventListener('prerenderingchange', send, { once: true });
  else send();
})();</script>
</head>
<body></body>
</html>
